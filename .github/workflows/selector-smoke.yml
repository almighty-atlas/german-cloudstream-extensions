name: Selector smoke test

# A green build only proves the providers compile. This is the job that notices a site
# redesign: it runs the parsers against the live pages and fails when a selector stops
# matching, so the breakage surfaces here instead of as a black screen on the TV.
#
# aniworld.to is deliberately not covered — it answers 403 to every request from a CI runner
# (DDoS-Guard, no solvable JS challenge), so any check against it would only ever report the
# bot filter.
#
# A non-zero Gradle exit is not by itself a selector break. Dependency resolution and
# live-site fetch failures are distinguished from parser assertions below.

on:
  push:
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/selector-smoke.yml'
      - 'common/**'
      - 'SerienStream/**'
      - 'Filmo/**'
      - 'smoke/**'
  schedule:
    # 05:17 UTC daily. Off the hour so it does not queue behind everyone else's cron.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Probe the live sites
        id: smoke
        env:
          SMOKE: '1'
        run: |
          chmod +x gradlew
          set +e
          rm -rf smoke/build/test-results

          run_smoke() {
            # Force live requests even when Gradle has cached the task outputs.
            ./gradlew -p smoke :test --tests '*LiveTest' --rerun-tasks --stacktrace "$@" 2>&1 | tee smoke.log
            return "${PIPESTATUS[0]}"
          }

          run_smoke
          status=$?

          if [ "$status" -ne 0 ] && \
             grep -qE "Could not (find|resolve)|Read timed out|Connection reset" smoke.log; then
            echo "Dependency lookup failed — retrying with fresh dependencies."
            sleep 15
            rm -rf smoke/build/test-results
            run_smoke --refresh-dependencies
            status=$?
          fi

          python3 smoke/verify_live_results.py "$status" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Selector smoke test"
            case "${{ steps.smoke.outputs.verdict }}" in
              pass)
                echo "All live selectors still match."
                ;;
              selectors)
                echo "A selector stopped matching. Failing assertions:"
                echo '```'
                if [ -f smoke.log ]; then grep -E "FAILED|stale|dead|parsed to nothing" smoke.log | head -40 || true; else echo "smoke.log was not created."; fi
                echo '```'
                ;;
              *)
                echo "No parser assertion proved that a selector is stale."
                echo "This is usually a dependency problem or a live-site fetch failure"
                echo "(DNS/TLS/403/429/5xx/timeout). Gradle's complaint:"
                echo '```'
                if [ -f smoke.log ]; then grep -A 4 "What went wrong" smoke.log | head -20 || true; else echo "smoke.log was not created; an earlier setup step failed."; fi
                echo '```'
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when a selector broke
        if: steps.smoke.outputs.verdict == 'selectors'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Selector smoke test failing';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'selector-rot',
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              'The nightly smoke test could not match one or more selectors against the live',
              'sites, which means a provider is broken or about to break.',
              '',
              `Run: ${run}`,
              '',
              'Fix: refresh the affected fixture under `*/src/test/resources/fixtures/`,',
              'update the selectors in `common/src/main/kotlin/com/germanstreams/common/parse/`,',
              'and bump the provider version so the app offers an update.',
            ].join('\n');

            if (existing.data.length > 0) {
              // Keep one open issue per outage rather than one per night.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing. Run: ${run}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['selector-rot'],
              });
            }

      - name: Close the issue once the selectors match again
        if: steps.smoke.outputs.verdict == 'pass'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'selector-rot',
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Selectors match again. Run: ${run}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Upload failure diagnostics
        if: steps.smoke.outputs.verdict != 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: selector-smoke-diagnostics
          path: |
            smoke.log
            smoke/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job
        if: steps.smoke.outputs.verdict != 'pass'
        run: exit 1
