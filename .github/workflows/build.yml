name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      # '*.md' only matches the repository root; '**.md' covers docs/ as well.
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v5
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fixture tests run as plain JVM modules and do not require the Cloudstream plugin.
      # A failing parser cannot replace previously published .cs3 artifacts.
      - name: Run parser fixture tests
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew -p smoke :AniWorld:test :Filmo:test :SerienStream:test --stacktrace
          for module in AniWorld Filmo SerienStream; do
            find "smoke/$module/build/test-results/test" -name '*.xml' -size +0c | grep -q . || {
              echo "No test report for $module" >&2
              exit 1
            }
          done

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          set -o pipefail
          ./gradlew make makePluginsJson --continue --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/builds/build.log

      - name: Verify and publish complete build
        run: |
          cd "$GITHUB_WORKSPACE/src"
          # A successful Gradle exit alone does not prove every expected plugin was emitted.
          artifacts_to_publish=()
          for module in */build.gradle.kts; do
            provider=${module%%/*}
            mapfile -t artifacts < <(find "$provider/build" -maxdepth 1 -name '*.cs3' -type f)
            if [ "${#artifacts[@]}" -ne 1 ] || [ ! -s "${artifacts[0]}" ]; then
              echo "Expected exactly one non-empty .cs3 for $provider" >&2
              exit 1
            fi
            artifacts_to_publish+=("${artifacts[0]}")
          done
          test -s build/plugins.json
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3
          cp "${artifacts_to_publish[@]}" build/plugins.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostics
          path: |
            src/smoke/*/build/test-results/test/*.xml
            src/build/reports/**
            builds/build.log
          if-no-files-found: ignore
          retention-days: 14
