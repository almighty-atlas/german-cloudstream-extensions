name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      # '*.md' only matches the repository root; '**.md' covers docs/ as well.
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs before the old .cs3 files are removed, so a red test leaves the previously
      # published plugins in place instead of replacing them with nothing.
      #
      # These are the parser tests: they check the selectors against checked-in page captures.
      # A failure here means a site changed and the provider is about to stop working — the
      # fix is to refresh the fixture and the selectors, not to skip the test. The live
      # counterparts only run in the nightly smoke workflow.
      - name: Run parser tests
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Build Plugins
        id: build
        run: |
          cd $GITHUB_WORKSPACE/src
          set +e
          # --continue: one provider failing to compile must not stop the others from
          # building. Without it a broken new provider takes the working ones down with it,
          # because the old .cs3 files were already deleted above.
          ./gradlew make makePluginsJson --continue --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/builds/build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds 2>/dev/null || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds 2>/dev/null || true
          exit 0

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Fail if the build failed
        if: steps.build.outputs.exit != '0'
        run: |
          echo "Gradle build failed (exit ${{ steps.build.outputs.exit }}). See build.log on the builds branch."
          exit 1
